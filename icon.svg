<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#2563eb"/>

  <!-- Washing machine body -->
  <rect x="96" y="80" width="320" height="352" rx="32" fill="#ffffff" opacity="0.15"/>
  <rect x="112" y="96" width="288" height="320" rx="24" fill="#ffffff"/>

  <!-- Machine door (circle) -->
  <circle cx="256" cy="288" r="100" fill="#dbeafe" stroke="#2563eb" stroke-width="12"/>
  <circle cx="256" cy="288" r="72" fill="#bfdbfe" stroke="#93c5fd" stroke-width="6"/>

  <!-- Water ripple inside drum -->
  <path d="M200 288 Q228 260 256 288 Q284 316 312 288" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M212 308 Q240 280 268 308 Q296 336 324 308" stroke="#3b82f6" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Control panel top -->
  <rect x="128" y="108" width="256" height="60" rx="12" fill="#eff6ff"/>
  <!-- Knob -->
  <circle cx="200" cy="138" r="18" fill="#2563eb"/>
  <circle cx="200" cy="138" r="9" fill="#ffffff"/>
  <!-- Buttons -->
  <rect x="240" y="124" width="40" height="14" rx="7" fill="#93c5fd"/>
  <rect x="290" y="124" width="40" height="14" rx="7" fill="#93c5fd"/>
  <rect x="240" y="144" width="90" height="10" rx="5" fill="#bfdbfe"/>
</svg>
